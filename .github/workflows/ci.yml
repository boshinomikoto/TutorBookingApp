name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TutorBookingApp.sln

      - name: Build
        run: dotnet build TutorBookingApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TutorBookingApp.sln --no-build --configuration Release
